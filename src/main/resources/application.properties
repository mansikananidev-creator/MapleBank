spring.application.name=bankingSystem
# DB_URL lets Docker Compose point this at the "mysql" service hostname instead of
# localhost; DB_USERNAME/DB_PASSWORD are also overridable for the same reason.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/unibank}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# app.jwt.secret reads from the JWT_SECRET environment variable when set. The value
# after the colon is only a local-dev fallback so the app still runs out of the box -
# in any real deployment you'd set JWT_SECRET in the environment and never commit the
# real signing key to source control.
app.jwt.secret=${JWT_SECRET:lRBV1qEs8tPdgI3OZK6LuoTfWoovmur5rvkuY06xTwM=}
app.jwt.expiration-ms=86400000

# Interactive API docs, once the app is running: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Password reset emails, sent via Gmail SMTP. MAIL_USERNAME/MAIL_PASSWORD read from the
# environment - MAIL_PASSWORD must be a Gmail "app password" (Google Account > Security >
# 2-Step Verification > App passwords), never your real Gmail password. See README.
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Base URL the frontend runs at, used to build the link inside password reset emails.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Comma-separated list of origins allowed to call this API (CORS). Add your deployed
# frontend's URL here (e.g. https://your-app.vercel.app) alongside or instead of the
# local dev default.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

#change port - PORT is set automatically by hosts like Render; 8081 is the local-dev fallback
server.port=${PORT:8081}

# RabbitMQ - decouples sending password-reset emails from the forgot-password request
# itself (see RabbitMQConfig, PasswordResetEmailListener). guest/guest is RabbitMQ's
# own out-of-the-box default, fine for local dev - override for anything real.
# RABBITMQ_SSL should be true for hosted brokers like CloudAMQP, which require TLS
# (port 5671) - leave false for a plain local/Docker broker (port 5672).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# If PasswordResetEmailListener throws (SMTP down, auth failure, etc.), retry up to
# 3 times with backoff (2s, 4s, 8s) before giving up. default-requeue-rejected=false
# means an exhausted message is rejected outright rather than looped back onto the
# same queue - RabbitMQConfig routes rejected messages to a dead-letter queue instead.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false