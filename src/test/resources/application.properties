# Test-only configuration. Spring Boot picks this up automatically for anything
# run under src/test, overriding the main application.properties, so the test
# suite runs against an isolated in-memory H2 database instead of the real
# local MySQL instance - no external database needed to run `mvn test`.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktMzItYnl0ZXMtbG9uZw==
app.jwt.expiration-ms=3600000
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173

# Excludes RabbitMQ auto-config so the test suite never needs a real broker running,
# same idea as swapping in H2 for MySQL above. AuthFlowIntegrationTest and
# BankingSystemApplicationTests supply a mocked RabbitTemplate instead (@MockitoBean)
# since AuthService still needs one injected.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# spring.mail.host must be set for Spring Boot to even create the JavaMailSender bean
# (EmailService depends on it) - without it the whole test context fails to start.
# "localhost" is never actually contacted: no test exercises the real send path.
spring.mail.host=localhost
spring.mail.port=25

# Short timeouts as a safety net - no test actually sends a real email (EmailService is
# mocked or the code path just isn't exercised in tests), but this keeps the whole suite
# from ever hanging if a test somehow triggers a real send attempt with no credentials.
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000
