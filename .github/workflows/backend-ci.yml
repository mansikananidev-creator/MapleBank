name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        # Tests run against the in-memory H2 database (see src/test/resources),
        # so no MySQL service container is needed here.
        run: ./mvnw -B test

      - name: Build
        run: ./mvnw -B package -DskipTests
